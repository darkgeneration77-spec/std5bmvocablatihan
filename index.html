 const score=latestScore.correct+mark,percent=Math.round(score/52*1000)/10,grade=percent>=80?'Cemerlang':percent>=60?'Baik':percent>=40?'Memuaskan':'Perlu Bimbingan';
 const date=new Date().toLocaleDateString('ms-MY',{day:'2-digit',month:'long',year:'numeric'});
 $('certificate').innerHTML=`<div style="font-size:17px;letter-spacing:3px">TAHUN 5 · BAHASA MELAYU · 2027</div><h2>SIJIL PENCAPAIAN</h2><div style="font-size:19px">DAN PENYATA KEPUTUSAN</div><p>Dengan ini diperakui bahawa</p><div class="big-name">${esc(name)}</div><p>telah melengkapkan Penilaian Penguasaan Kosa Kata</p><h3>${esc(DATA[current].title)}</h3><div class="cert-grade">${grade} · ${percent.toFixed(1)}%</div><div class="cert-grid"><div>Bahagian A & B<br><strong>${latestScore.correct} / 48</strong></div><div>Bahagian C (guru)<br><strong>${mark} / 4</strong></div><div>Jumlah Markah<br><strong>${score} / 52</strong></div><div>Jawapan A & B belum dijawab<br><strong>${latestScore.missing}</strong></div></div><p>Tarikh: ${esc(date)}</p><p style="font-size:13px">Penilaian latihan dalaman; bukan sijil atau keputusan rasmi UASA.</p><div class="cert-foot"><span>Tandatangan Guru</span><span>Tarikh Pengesahan</span></div>`;
 $('certificate').classList.add('active');$('printCert').disabled=false;$('certMsg').textContent='Sijil siap. Klik Cetak / Simpan PDF. / 成绩单已生成，可打印或保存PDF。';
 try{localStorage.setItem('bm2027result_'+current,JSON.stringify({name,score,percent,grade,date,auto:latestScore.correct,teacher:mark}))}catch(e){}
 $('certificate').scrollIntoView({behavior:'smooth',block:'start'});
}
function printCertificate(){if(!$('certificate').classList.contains('active'))return;document.body.classList.add('print-certificate');window.print();}
window.addEventListener('afterprint',()=>document.body.classList.remove('print-certificate'));

DATA.forEach((d,i)=>{let o=document.createElement('option');o.value=i;o.textContent=d.title;$('theme').appendChild(o)});$('theme').onchange=e=>{current=Number(e.target.value);latestScore=null;$('certificate').classList.remove('active');render()};$('reset').onclick=()=>{if(confirm('Kosongkan semua jawapan untuk tema ini?')){localStorage.removeItem(key());render()}};$('print').onclick=()=>{document.body.classList.remove('print-certificate');window.print()};render();

(function(){
function popup(title,score,detail){
 const old=document.getElementById('dg-popup');if(old)old.remove();
 const layer=document.createElement('div');layer.id='dg-popup';layer.className='dg-modal-backdrop';layer.setAttribute('role','presentation');
 const dialog=document.createElement('div');dialog.className='dg-modal';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-labelledby','dg-title');
 const h=document.createElement('h2');h.id='dg-title';h.textContent=title;dialog.appendChild(h);
 if(score!==null){const s=document.createElement('div');s.className='dg-score';s.textContent=score;dialog.appendChild(s);}
 const p=document.createElement('p');p.textContent=detail;dialog.appendChild(p);
 const buttons=document.createElement('div');buttons.className='dg-buttons';const close=document.createElement('button');close.type='button';close.textContent='Tutup / 关闭';buttons.appendChild(close);dialog.appendChild(buttons);layer.appendChild(dialog);document.body.appendChild(layer);
 const previous=document.activeElement;const dismiss=()=>{layer.remove();document.removeEventListener('keydown',onkey);if(previous&&previous.focus)previous.focus();};
 const onkey=e=>{if(e.key==='Escape')dismiss();if(e.key==='Tab'){e.preventDefault();close.focus();}};
 close.onclick=dismiss;layer.onclick=e=>{if(e.target===layer)dismiss();};document.addEventListener('keydown',onkey);close.focus();
}
const originalCheck=check;check=function(){originalCheck();if(latestScore)popup('Keputusan Semakan / 批改成绩',latestScore.correct+' / 48','Bahagian A & B telah disemak. Bahagian C perlu dinilai oleh guru. / A、B部分已批改，C部分由老师评分。');};
const originalCert=makeCertificate;makeCertificate=function(){originalCert();if(document.getElementById('certificate').classList.contains('active')){const grade=document.querySelector('.cert-grade');popup('Sijil Berjaya Dijana / 文凭已生成',null,'Sijil dan penyata keputusan sudah tersedia. Gunakan Cetak / Simpan PDF untuk menyimpan. / 可打印或保存为PDF。');}};
})();
</script></body></html>
